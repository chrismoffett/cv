name: Build CV

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - 'cv_content.yaml'

permissions:
  contents: write
  issues: write

# One build at a time; a queued run waits instead of racing the commit step.
concurrency:
  group: build-cv
  cancel-in-progress: false

jobs:
  build:
    # Pinned image: ubuntu-latest moved to Ubuntu 26 and broke the apt step.
    # Bump deliberately (and test with Run workflow) before GitHub retires 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download cv_content.yaml from Google Drive
        id: dl
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_CV_FOLDER_ID: ${{ secrets.GDRIVE_CV_FOLDER_ID }}
        run: |
          pip install google-auth==2.53.0 google-auth-oauthlib==1.4.0 google-api-python-client==2.196.0
          python3 - << 'PYEOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          import io

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET']
          )
          service = build('drive', 'v3', credentials=creds)

          folder_id = os.environ['GDRIVE_CV_FOLDER_ID']
          results = service.files().list(
              q=f"name='cv_content.yaml' and '{folder_id}' in parents and trashed=false",
              fields='files(id, name)').execute()
          files = results.get('files', [])
          if not files:
              raise SystemExit("cv_content.yaml not found in Drive folder — check GDRIVE_CV_FOLDER_ID")
          file_id = files[0]['id']
          print(f"Resolved cv_content.yaml to file ID {file_id}")

          request = service.files().get_media(fileId=file_id)
          buf = io.BytesIO()
          downloader = MediaIoBaseDownload(buf, request)
          done = False
          while not done:
              _, done = downloader.next_chunk()
          with open('cv_content.yaml', 'wb') as f:
              f.write(buf.getvalue())
          print("Downloaded cv_content.yaml from Drive")
          PYEOF

      - name: Detect change against last published yaml
        id: chg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet -- cv_content.yaml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "cv_content.yaml unchanged since last build; skipping."
            # GitHub pauses scheduled workflows after 60 days without repo activity.
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$age" -gt 3456000 ]; then
              echo "stale=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Keepalive commit (keeps the schedule from being paused)
        if: steps.chg.outputs.changed == 'false' && steps.chg.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%d" > .keepalive
          git add .keepalive
          git commit -m "Keepalive [$(date +'%Y-%m-%d')]"
          git push

      - name: Install system dependencies
        if: steps.chg.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q \
              && sudo apt-get install -y -q \
                fonts-noto-cjk-extra \
                libpango-1.0-0 \
                libpangocairo-1.0-0 \
                libcairo2 \
                libgdk-pixbuf2.0-0 \
              && exit 0
            echo "apt attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Install Python dependencies
        if: steps.chg.outputs.changed == 'true'
        run: pip install weasyprint==70.0 pyyaml==6.0.3

      - name: Build PDF
        if: steps.chg.outputs.changed == 'true'
        run: |
          python3 cv_build.py --output CV_Moffett_public.pdf
          python3 cv_build.py --full --output CV_Moffett.pdf

      - name: Build HTML
        if: steps.chg.outputs.changed == 'true'
        run: python3 cv_build_html.py --output CV_Moffett.html

      - name: Upload PDF and HTML to Google Drive
        if: steps.chg.outputs.changed == 'true'
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_CV_FOLDER_ID: ${{ secrets.GDRIVE_CV_FOLDER_ID }}
        run: |
          python3 - << 'PYEOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET']
          )
          service = build('drive', 'v3', credentials=creds)
          folder_id = os.environ['GDRIVE_CV_FOLDER_ID']

          for filename, mime in [
              ('CV_Moffett.pdf', 'application/pdf'),
              ('CV_Moffett_public.pdf', 'application/pdf'),
              ('CV_Moffett.html', 'text/html'),
          ]:
              results = service.files().list(
                  q=f"name='{filename}' and '{folder_id}' in parents and trashed=false",
                  fields='files(id)').execute()
              files = results.get('files', [])
              media = MediaFileUpload(filename, mimetype=mime)
              if files:
                  service.files().update(fileId=files[0]['id'], media_body=media).execute()
                  print(f"Updated {filename} in Drive")
              else:
                  service.files().create(
                      body={'name': filename, 'parents': [folder_id]},
                      media_body=media).execute()
                  print(f"Created {filename} in Drive")
          PYEOF

      - name: Commit built files to repo
        if: steps.chg.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CV_Moffett_public.pdf CV_Moffett.html index.html cv_content.yaml
          git diff --staged --quiet || git commit -m "Build CV [$(date +'%Y-%m-%d')]"
          git push

      - name: Close any open build-failure issue
        if: success() && steps.chg.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --state open --search "CV build failed in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Build succeeded in run $GITHUB_RUN_ID."
          done

      - name: Open an issue if the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$(gh issue list --state open --search "CV build failed in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "CV build failed" \
              --body "The scheduled or manual CV build failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
